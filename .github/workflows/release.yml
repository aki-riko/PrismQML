name: Build and Release

# 推送 v* tag 时触发:多平台构建 wheel + sdist,并发布到 PyPI。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:  # 允许手动触发(只构建不发布)

env:
  # The protected suite is split into isolated shards; keep 20 minutes per
  # shard and a five-minute supervisor margin for cleanup diagnostics.
  # 完整套件已拆成隔离分片；每片 20 分钟，外层再留 5 分钟清理诊断余量。
  PRISM_FULL_PYTEST_TIMEOUT_SECONDS: "1200"
  PRISM_FULL_PYTEST_SUPERVISOR_TIMEOUT_SECONDS: "1500"
  # 串行分片逐文件隔离运行。实测同一文件单独跑 0.5s，在五个兄弟进程争抢四个核心时
  # 需要 19-42s(约 40-84 倍退化)，180s 仅剩约 4 倍余量会误杀健康分片(exit=124，无栈)。
  PRISM_SERIAL_RUNTIME_TIMEOUT_SECONDS: "900"

jobs:
  quality_gate:
    name: Source quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            cpp/tests/requirements.txt
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-prismqml-rust-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-prismqml-rust-
      - name: Install Qt (desktop)
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.3"
          modules: qtshadertools
          # 不让 action 安装并前置自带 Python: 否则 PATH 会被 hostedtoolcache 的
          # 最新 Python(实测 3.14.7) 顶掉, pip 依赖安装的解释器与 CMake 选中的
          # 解释器可能分离。此前仅靠"依赖安装在 install-qt 之后"侥幸一致, 现固定
          # 为 setup-python 的 3.12, 并由下方 Python3_EXECUTABLE 显式锁定。
          setup-python: false
      - name: Install source test dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]" -r cpp/tests/requirements.txt
      - name: Run Python tests
        env:
          QT_QPA_PLATFORM: offscreen
          LD_LIBRARY_PATH: ${{ env.pythonLocation }}/lib
          QT_PLUGIN_PATH: ""
          QML2_IMPORT_PATH: ""
          QML_IMPORT_PATH: ""
        run: >-
          python scripts/test_process.py --qt-platform offscreen
          --timeout $PRISM_FULL_PYTEST_SUPERVISOR_TIMEOUT_SECONDS --
          python scripts/run_test_shards.py --full-suite
          --timeout $PRISM_FULL_PYTEST_TIMEOUT_SECONDS
          --serial-timeout $PRISM_SERIAL_RUNTIME_TIMEOUT_SECONDS
          --supervisor-timeout $PRISM_FULL_PYTEST_SUPERVISOR_TIMEOUT_SECONDS
      # The console keeps only a 12000-char tail; a hang's thread dump needs the full log.
      # 控制台只保留 12000 字符尾部, 卡死时的线程栈转储需要完整日志。
      - name: Upload shard logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-shard-logs-release
          path: .artifacts/python/test-shards/*/pytest.log
          if-no-files-found: warn
      - name: Probe source QML components
        env:
          QT_QPA_PLATFORM: offscreen
          LD_LIBRARY_PATH: ${{ env.pythonLocation }}/lib
          QT_PLUGIN_PATH: ""
          QML2_IMPORT_PATH: ""
          QML_IMPORT_PATH: ""
        run: >-
          python scripts/test_process.py --qt-platform offscreen --timeout 180 --
          python tests/qml/probe_all_components.py
      # The offscreen suite pins the device pixel ratio to 1.0, where every
      # physical-pixel snap is an identity. This gate re-runs the physical-pixel
      # contracts with a non-1.0 factor so dpr-dependent defects surface in CI.
      # offscreen 套件把设备像素比固定为 1.0, 此时物理像素对齐全部退化为恒等。该门禁以
      # 非 1.0 因子重跑物理像素合同, 使依赖 dpr 的缺陷在 CI 中暴露。
      - name: Run device-pixel-ratio gate
        env:
          QT_QPA_PLATFORM: offscreen
          LD_LIBRARY_PATH: ${{ env.pythonLocation }}/lib
          QT_PLUGIN_PATH: ""
          QML2_IMPORT_PATH: ""
          QML_IMPORT_PATH: ""
        run: >-
          python scripts/test_process.py --qt-platform offscreen --timeout 900 --
          python scripts/device_pixel_ratio_gate.py
      - name: Run Rust tests
        run: cargo test --manifest-path rust/Cargo.toml
      - name: Configure and build C++ tests
        shell: bash
        run: |
          qt-cmake -S cpp -B .artifacts/cpp/ci-quality -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPRISM_BUILD_DEMO=OFF \
            -DPRISM_BUILD_GALLERY=OFF \
            -DPRISM_VERIFY_MOBILE=OFF \
            -DPRISM_BUILD_TESTS=ON \
            -DPython3_EXECUTABLE="${{ steps.python.outputs.python-path }}"
          cmake --build .artifacts/cpp/ci-quality
      - name: Run headless C++ tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          ctest --test-dir .artifacts/cpp/ci-quality -L headless --interactive-debug-mode 0
          --output-on-failure --no-tests=error
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    needs: quality_gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pin the macOS image instead of macos-latest so the toolchain never moves under a release.
        # 固定 macOS 镜像而非 macos-latest, 避免工具链在发版期间悄悄迁移。
        os: [ubuntu-latest, windows-latest, macos-26]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            cpp/tests/requirements.txt

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21
        env:
          # abi3: 一个 wheel 兼容 py3.9+,只需为 cp39 构建一次/平台
          CIBW_BUILD: "cp39-*"
          # 通过 config-settings 把 --py-limited-api 传给 setuptools bdist_wheel(产出 abi3 wheel)
          CIBW_CONFIG_SETTINGS: "--build-option=--py-limited-api=cp39"
          # Install the OpenSSL 3 runtime, Rust and libcurl headers in each Linux container.
          # Crashpad links libcurl on Linux even with SENTRY_TRANSPORT=none; auditwheel then
          # grafts libcurl and its dependencies into the wheel (unused at runtime, no upload).
          # 每个 Linux 容器内安装 OpenSSL 3 运行库、Rust 与 libcurl 头文件。Crashpad 在 Linux 上即使
          # SENTRY_TRANSPORT=none 也链接 libcurl，auditwheel 会把它及其依赖打进 wheel（运行时不调用、不上传）。
          CIBW_BEFORE_ALL_LINUX: >-
            dnf install -y "$PRISM_EPEL_RELEASE_RPM" &&
            dnf install -y openssl3-libs libcurl-devel &&
            curl -sSf https://sh.rustup.rs | sh -s -- -y
          # Build the pinned sentry-native crash runtime that setup.py bundles into the wheel
          # 构建 setup.py 打进 wheel 的固定版本 sentry-native 崩溃运行时
          CIBW_BEFORE_BUILD: python "{package}/scripts/build_crash_runtime.py"
          # Platform variants are set separately, so each repeats PRISM_REQUIRE_CRASH_RUNTIME
          # 各平台变量分别设置，因此每个都重复 PRISM_REQUIRE_CRASH_RUNTIME
          CIBW_ENVIRONMENT_LINUX: >-
            PATH=$HOME/.cargo/bin:$PATH
            QT_QPA_PLATFORM=offscreen
            PRISM_EPEL_RELEASE_RPM=https://dl.fedoraproject.org/pub/epel/epel-release-latest-8.noarch.rpm
            PRISM_REQUIRE_CRASH_RUNTIME=1
          CIBW_ENVIRONMENT_WINDOWS: "PYTHONIOENCODING=utf-8 PRISM_REQUIRE_CRASH_RUNTIME=1"
          CIBW_ENVIRONMENT_MACOS: "PRISM_REQUIRE_CRASH_RUNTIME=1"
          # PySide6 6.9+ 的 Linux wheel 以 manylinux_2_28 为最低平台基线
          CIBW_MANYLINUX_X86_64_IMAGE: "manylinux_2_28"
          # 跳过 musllinux(rusqlite bundled 在 musl 上编译慢) + 32位i686(PySide6不支持,rustup装不上)
          CIBW_SKIP: "*-musllinux* *_i686 *-win32"
          CIBW_TEST_COMMAND: >-
            python "{project}/scripts/test_process.py" --qt-platform offscreen
            --timeout 60 -- python -c "import prismqml, prismqml_rs;
            assert prismqml.__version__;
            assert prismqml_rs.__version__" &&
            python "{project}/scripts/test_process.py" --qt-platform offscreen
            --timeout 180 -- python "{project}/tests/qml/probe_all_components.py"
            --installed &&
            python "{project}/scripts/test_process.py" --qt-platform offscreen
            --timeout 180 -- python "{project}/tests/test_provider_lifecycle.py" &&
            python "{project}/scripts/test_process.py" --qt-platform offscreen
            --timeout 180 -- python "{project}/tests/crash_reporter_probe.py"

      - name: Validate wheel structure
        run: python scripts/validate_dist.py --expect-wheels 1 --expect-crash-runtime "wheelhouse/*.whl"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  python_compatibility:
    name: Python ${{ matrix.python-version }} abi3 wheel
    needs: build_wheels
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            cpp/tests/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: wheels-ubuntu-latest
          path: wheelhouse
      - name: Install wheel probe runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1
      - name: Install abi3 wheel
        shell: bash
        run: python -m pip install --disable-pip-version-check wheelhouse/*.whl
      - name: Probe installed abi3 wheel
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          LD_LIBRARY_PATH: ${{ env.pythonLocation }}/lib
          QT_PLUGIN_PATH: ""
          QML2_IMPORT_PATH: ""
          QML_IMPORT_PATH: ""
        run: |
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/scripts/test_process.py" \
            --qt-platform offscreen --timeout 60 -- python \
            -c "import prismqml, prismqml_rs; assert prismqml.__version__; assert prismqml_rs.__version__"
          python "$GITHUB_WORKSPACE/scripts/test_process.py" \
            --qt-platform offscreen --timeout 180 -- python \
            "$GITHUB_WORKSPACE/tests/qml/probe_all_components.py" --installed
          python "$GITHUB_WORKSPACE/scripts/test_process.py" \
            --qt-platform offscreen --timeout 180 -- python \
            "$GITHUB_WORKSPACE/tests/test_provider_lifecycle.py"
          python "$GITHUB_WORKSPACE/scripts/test_process.py" \
            --qt-platform offscreen --timeout 180 -- python \
            "$GITHUB_WORKSPACE/tests/crash_reporter_probe.py"

  build_sdist:
    name: Build source distribution
    needs: quality_gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            cpp/tests/requirements.txt
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build sdist
        run: |
          python -m pip install build
          python -m build --sdist --outdir .artifacts/python/dist
      - name: Validate sdist contents
        run: python scripts/validate_dist.py --expect-sdist ".artifacts/python/dist/*.tar.gz"
      - name: Install sdist probe runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1
      - name: Install and probe sdist
        shell: bash
        run: |
          SDIST_PATH="$(find "$GITHUB_WORKSPACE/.artifacts/python/dist" -maxdepth 1 -name '*.tar.gz' -print -quit)"
          TEST_VENV="$RUNNER_TEMP/prism-sdist-venv"
          python -m venv "$TEST_VENV"
          "$TEST_VENV/bin/python" -m pip install --disable-pip-version-check "$SDIST_PATH"
          cd "$RUNNER_TEMP"
          "$TEST_VENV/bin/python" "$GITHUB_WORKSPACE/scripts/test_process.py" \
            --qt-platform offscreen --timeout 60 -- "$TEST_VENV/bin/python" \
            -c "import prismqml, prismqml_rs; assert prismqml.__version__; assert prismqml_rs.__version__"
          "$TEST_VENV/bin/python" "$GITHUB_WORKSPACE/scripts/test_process.py" \
            --qt-platform offscreen --timeout 180 -- "$TEST_VENV/bin/python" \
            "$GITHUB_WORKSPACE/tests/qml/probe_all_components.py" --installed
          "$TEST_VENV/bin/python" "$GITHUB_WORKSPACE/scripts/test_process.py" \
            --qt-platform offscreen --timeout 180 -- "$TEST_VENV/bin/python" \
            "$GITHUB_WORKSPACE/tests/test_provider_lifecycle.py"
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: ./.artifacts/python/dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [quality_gate, build_wheels, python_compatibility, build_sdist]
    runs-on: ubuntu-latest
    # 仅在 tag 推送时发布(手动触发不发)
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write  # PyPI Trusted Publishing 需要
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: .artifacts/python/dist
          merge-multiple: true
      - name: Revalidate merged release artifacts
        run: python scripts/validate_dist.py --expect-sdist --expect-wheels 3 --expect-crash-runtime ".artifacts/python/dist/*"
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: .artifacts/python/dist

