name: Build and Release

# 推送 v* tag 时触发:多平台构建 wheel + sdist,并发布到 PyPI。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:  # 允许手动触发(只构建不发布)

jobs:
  quality_gate:
    name: Source quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install Qt (desktop)
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.3"
          modules: qtshadertools
      - name: Install source test dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]" -r cpp/tests/requirements.txt
      - name: Run Python tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest
      - name: Probe source QML components
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/qml/probe_all_components.py
      - name: Run Rust tests
        run: cargo test --manifest-path rust/Cargo.toml
      - name: Configure and build C++ tests
        shell: bash
        run: |
          qt-cmake -S cpp -B cpp/build-quality -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPRISM_BUILD_DEMO=OFF \
            -DPRISM_BUILD_GALLERY=OFF \
            -DPRISM_VERIFY_MOBILE=OFF \
            -DPRISM_BUILD_TESTS=ON \
            -DPython3_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')"
          cmake --build cpp/build-quality
      - name: Run C++ tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir cpp/build-quality --output-on-failure --no-tests=error

  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    needs: quality_gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21
        env:
          # abi3: 一个 wheel 兼容 py3.9+,只需为 cp39 构建一次/平台
          CIBW_BUILD: "cp39-*"
          # 通过 config-settings 把 --py-limited-api 传给 setuptools bdist_wheel(产出 abi3 wheel)
          CIBW_CONFIG_SETTINGS: "--build-option=--py-limited-api=cp39"
          # 每个 Linux 容器内安装 Rust
          CIBW_BEFORE_ALL_LINUX: "curl -sSf https://sh.rustup.rs | sh -s -- -y"
          CIBW_ENVIRONMENT_LINUX: "PATH=$HOME/.cargo/bin:$PATH"
          # 跳过 musllinux(rusqlite bundled 在 musl 上编译慢) + 32位i686(PySide6不支持,rustup装不上)
          CIBW_SKIP: "*-musllinux* *_i686 *-win32"
          CIBW_TEST_COMMAND: >-
            python -c "import prismqml, prismqml_rs;
            assert prismqml.__version__;
            assert prismqml_rs.__version__" &&
            python "{project}/tests/test_provider_lifecycle.py"
          CIBW_TEST_ENVIRONMENT: "QT_QPA_PLATFORM=offscreen"

      - name: Validate wheel structure
        run: python scripts/validate_dist.py --expect-wheels 1 "wheelhouse/*.whl"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    needs: quality_gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build sdist
        run: |
          python -m pip install build
          python -m build --sdist
      - name: Validate sdist contents
        run: python scripts/validate_dist.py --expect-sdist "dist/*.tar.gz"
      - name: Install and probe sdist
        shell: bash
        run: |
          SDIST_PATH="$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -name '*.tar.gz' -print -quit)"
          TEST_VENV="$RUNNER_TEMP/prism-sdist-venv"
          python -m venv "$TEST_VENV"
          "$TEST_VENV/bin/python" -m pip install --disable-pip-version-check "$SDIST_PATH"
          cd "$RUNNER_TEMP"
          "$TEST_VENV/bin/python" -c "import prismqml, prismqml_rs; assert prismqml.__version__; assert prismqml_rs.__version__"
          QT_QPA_PLATFORM=offscreen "$TEST_VENV/bin/python" \
            "$GITHUB_WORKSPACE/tests/qml/probe_all_components.py" --installed
          QT_QPA_PLATFORM=offscreen "$TEST_VENV/bin/python" \
            "$GITHUB_WORKSPACE/tests/test_provider_lifecycle.py"
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: ./dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [quality_gate, build_wheels, build_sdist]
    runs-on: ubuntu-latest
    # 仅在 tag 推送时发布(手动触发不发)
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write  # PyPI Trusted Publishing 需要
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Revalidate merged release artifacts
        run: python scripts/validate_dist.py --expect-sdist --expect-wheels 3 "dist/*"
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

