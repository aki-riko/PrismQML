name: Build All Platforms (C++ host)

# 统一多平台构建: 桌面(Win/Linux/macOS) + Android(arm64) + iOS(simulator)。
# 一次触发, 各平台并行构建 prism 库 + demo, 各自上传 artifact。
# 替代散落的本地 build_*.bat 脚本与独立 ios.yml。
on:
  workflow_dispatch:
  push:
    paths:
      - "cpp/**"
      - "examples/**"
      - "prismqml/**"
      - "rust/**"
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/**"

env:
  PRISM_FULL_PYTEST_TIMEOUT_SECONDS: "720"

jobs:
  qml_conventions:
    name: QML conventions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scanner test dependency
        run: python -m pip install --disable-pip-version-check "pytest>=8.4"
      - name: Run scanner regression tests
        run: >-
          python scripts/test_process.py --qt-platform offscreen --timeout 120 --
          python -m pytest tests/test_qml_conventions.py
          tests/test_qml_color_arrays.py
          tests/test_qml_color_array_returns.py
          tests/test_qml_color_constructors.py
          tests/test_qml_color_dataflow.py
          tests/test_qml_color_dataflow_performance.py
          tests/test_qml_color_dataflow_scopes.py
          tests/test_qml_color_findings.py
          tests/test_qml_example_scope.py
          tests/test_qml_lexer.py -q
      - name: Reject newly introduced QML violations
        shell: bash
        run: |
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="HEAD^"
          fi
          python scripts/check_qml_conventions.py --changed --base "$BASE"
      - name: Report library debt and examples QML010
        run: python scripts/check_qml_conventions.py --all --report-only

  python_quality:
    name: Python/QML zero-interaction gate (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install source test dependencies
        run: >-
          python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Run protected Python tests
        env:
          QT_PLUGIN_PATH: ""
          QML2_IMPORT_PATH: ""
          QML_IMPORT_PATH: ""
        run: >-
          python scripts/test_process.py --qt-platform offscreen
          --timeout $env:PRISM_FULL_PYTEST_TIMEOUT_SECONDS --
          python -m pytest
      - name: Probe source QML components
        env:
          QT_PLUGIN_PATH: ""
          QML2_IMPORT_PATH: ""
          QML_IMPORT_PATH: ""
        run: >-
          python scripts/test_process.py --qt-platform offscreen --timeout 180 --
          python tests/qml/probe_all_components.py

  # ==================== 桌面三平台 ====================
  desktop:
    name: Desktop ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python for C++ test tools
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install C++ test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          -r cpp/tests/requirements.txt "pytest>=8.4"
      - name: Verify non-interactive test launcher
        run: >-
          python scripts/test_process.py --qt-platform offscreen --timeout 120 --
          python -m pytest tests/test_test_process.py
          tests/test_windows_test_process.py -q
      - name: Install Qt (desktop)
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.3"
          modules: qtshadertools
      # Windows: 激活 MSVC 环境(Qt 是 msvc2022_64, 必须 MSVC 编译; 否则 qt-cmake
      # 选 PATH 里的 MinGW → 链接 MSVC 的 Qt .lib name-mangling 不兼容全 undefined)
      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Configure & build
        shell: bash
        run: |
          # Windows: qt-cmake 全路径 + MSVC 已激活, 显式 NMake/Ninja 用 cl
          if [ "${{ runner.os }}" = "Windows" ]; then
            QTCMAKE="$QT_ROOT_DIR/bin/qt-cmake.bat"
          else
            QTCMAKE="qt-cmake"
          fi
          "$QTCMAKE" -S cpp -B .artifacts/cpp/ci-desktop -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DPRISM_BUILD_NATIVE_TESTS=ON
          cmake --build .artifacts/cpp/ci-desktop
      - name: Run headless unit tests
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          ctest --test-dir .artifacts/cpp/ci-desktop -L headless --interactive-debug-mode 0
          --output-on-failure --no-tests=error
      - name: Run native platform tests
        if: runner.os == 'Windows'
        shell: bash
        run: >-
          ctest --test-dir .artifacts/cpp/ci-desktop -L native --interactive-debug-mode 0
          --output-on-failure --no-tests=error
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            .artifacts/cpp/ci-desktop/prism_demo*
            .artifacts/cpp/ci-desktop/libprism.*
            .artifacts/cpp/ci-desktop/prism.lib
          if-no-files-found: warn

  # ==================== Android arm64 ====================
  android:
    name: Android arm64-v8a
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Qt (desktop host)
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.3"
          modules: qtshadertools
      - name: Install Qt for Android
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.3"
          target: android
          arch: android_arm64_v8a
          modules: qtshadertools
      - name: Build apk
        shell: bash
        run: |
          # 两次 install-qt 后 QT_ROOT_DIR 被 android 覆盖, 故用固定路径结构(都在
          # $RUNNER_WORKSPACE/Qt/6.10.3/<arch>)而非 dirname 推导, 避免 host 路径错。
          QT_BASE="$RUNNER_WORKSPACE/Qt/6.10.3"
          QT_ANDROID="$QT_BASE/android_arm64_v8a"
          QT_HOST="$QT_BASE/gcc_64"
          echo "QT_ANDROID=$QT_ANDROID  QT_HOST=$QT_HOST"
          ls "$QT_HOST/lib/cmake/Qt6CoreTools" || echo "WARN: host 缺 CoreTools"
          "$QT_ANDROID/bin/qt-cmake" -S cpp -B .artifacts/cpp/ci-android-arm64 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DQT_HOST_PATH="$QT_HOST" \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" \
            -DQT_ANDROID_ABIS=arm64-v8a \
            -DPRISM_BUILD_TESTS=OFF -DPRISM_VERIFY_MOBILE=OFF
          cmake --build .artifacts/cpp/ci-android-arm64 --target prism_demo_make_apk
          find .artifacts/cpp/ci-android-arm64 -name "*.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-arm64-apk
          path: .artifacts/cpp/ci-android-arm64/**/*.apk
          if-no-files-found: warn

  # ==================== iOS (模拟器, 免开发者账号) ====================
  ios:
    name: iOS simulator
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt (macOS desktop host)
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.3"
          host: mac
          target: desktop
          arch: clang_64
          modules: qtshadertools
      - name: Install Qt for iOS
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.3"
          host: mac
          target: ios
          modules: qtshadertools
      - name: Configure & build (simulator, no codesign)
        run: |
          QT_BASE="$RUNNER_WORKSPACE/Qt/6.10.3"
          QT_IOS="$QT_BASE/ios"
          QT_HOST="$QT_BASE/macos"
          echo "QT_IOS=$QT_IOS  QT_HOST=$QT_HOST"
          "$QT_IOS/bin/qt-cmake" -S cpp -B .artifacts/cpp/ci-ios -G Xcode \
            -DCMAKE_BUILD_TYPE=Release \
            -DQT_HOST_PATH="$QT_HOST" \
            -DPRISM_BUILD_TESTS=OFF -DPRISM_VERIFY_MOBILE=OFF \
            -DCMAKE_OSX_SYSROOT=iphonesimulator
          cd .artifacts/cpp/ci-ios
          # 工程名=顶层 project(prism) → prism.xcodeproj; target/scheme=prism_demo。
          # 不用 | tail(pipefail下会吞 xcodebuild 失败码 → 假成功)。
          xcodebuild -project prism.xcodeproj -scheme prism_demo \
            -configuration Release -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          echo "=== 产物 .app ==="
          find . -name "*.app" -type d
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: |
            .artifacts/cpp/ci-ios/**/*.app
            .artifacts/cpp/ci-ios/Release-iphonesimulator/**
          if-no-files-found: error

